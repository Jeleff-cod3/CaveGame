<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Gibberish Tester</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1f24;
      --muted: #5b6472;
      --line: #d7dde5;
      --panel: #f7f9fb;
      --accent: #146c94;
      --ok: #126b42;
      --bad: #9a3412;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      padding: 6px 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      min-width: 180px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 20px;
      padding-top: 20px;
    }

    section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 16px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin: 10px 0 4px;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
      font: inherit;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      margin-top: 8px;
    }

    .pill {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill.ok {
      border-color: color-mix(in srgb, var(--ok), var(--line) 55%);
      color: var(--ok);
    }

    .pill.bad {
      border-color: color-mix(in srgb, var(--bad), var(--line) 55%);
      color: var(--bad);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .hidden-file {
      display: none;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 7px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    button.danger {
      border-color: var(--bad);
      background: var(--bad);
    }

    button:disabled {
      border-color: var(--line);
      background: #eef1f5;
      color: var(--muted);
      cursor: not-allowed;
    }

    pre,
    .log {
      margin: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px;
      overflow: auto;
      min-height: 150px;
      max-height: 520px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
    }

    .allowed {
      color: var(--ok);
      font-weight: 700;
    }

    .blocked {
      color: var(--bad);
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 820px) {
      main {
        padding: 16px;
      }

      header,
      .grid {
        display: block;
      }

      .status {
        margin-top: 12px;
        text-align: left;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Live Gibberish Tester</h1>
      </div>
      <div id="connectionStatus" class="status">Idle</div>
    </header>

    <div class="grid">
      <div>
        <section>
          <h2>Audio Bank</h2>
          <label for="bankUser">User</label>
          <input id="bankUser" value="{{ status.audio_bank_user }}" autocomplete="off">

          <label for="bankWord">Whitelist Word</label>
          <input id="bankWord" autocomplete="off">
          <div class="actions">
            <button id="recordWord">Record Word</button>
            <button id="stopWord" class="danger">Stop Word</button>
          </div>
          <div id="bankWords" class="list"></div>

          <div class="row">
            <div>
              <label for="gibberishBucket">Gibberish Bucket</label>
              <select id="gibberishBucket">
                <option value="short">short</option>
                <option value="medium">medium</option>
                <option value="long">long</option>
              </select>
            </div>
            <div>
              <label for="gibberishName">Clip Name</label>
              <input id="gibberishName" autocomplete="off">
            </div>
          </div>
          <div class="actions">
            <button id="recordGibberish">Record Gibberish</button>
            <button id="stopGibberish" class="danger">Stop Gibberish</button>
          </div>
          <div id="gibberishClips" class="list"></div>

          <div class="actions">
            <button id="validateBank" class="secondary">Validate Bank</button>
            <button id="useBankConfig" class="secondary">Use Bank Config</button>
          </div>
          <pre id="bankStatusJson">{}</pre>
        </section>

        <section>
          <h2>Config</h2>
          <label for="whitelist">Whitelist Words</label>
          <input id="whitelist" value='{{ status.whitelist|join:", " }}' autocomplete="off">

          <label for="seed">Seed</label>
          <input id="seed" value="{{ status.seed }}" autocomplete="off">

          <label for="audioBankUser">Audio Bank User</label>
          <input id="audioBankUser" value="{{ status.audio_bank_user }}" autocomplete="off">

          <label for="audioReplacementMode">Audio Replacement Mode</label>
          <select id="audioReplacementMode">
            <option value="original_gibberish">original_gibberish</option>
            <option value="prerecorded_sample_substitution">prerecorded_sample_substitution</option>
          </select>

          <label for="audioBankMissingWordPolicy">Missing Word Fallback</label>
          <select id="audioBankMissingWordPolicy">
            <option value="strict">strict</option>
            <option value="safe">safe</option>
            <option value="debug">debug</option>
          </select>

          <label for="asrModel">GPU ASR Model</label>
          <input id="asrModel" value="{{ status.asr_model }}" placeholder="hello danger">
          <div id="modelHint" class="hint"></div>

          <div class="row">
            <div>
              <label for="confidence">Confidence</label>
              <input id="confidence" type="number" step="0.05" min="0" max="1" value="{{ status.confidence }}">
            </div>
            <div>
              <label for="bufferSeconds">Buffer Seconds</label>
              <input id="bufferSeconds" type="number" step="0.5" min="0.5" value="{{ status.buffer_seconds }}">
            </div>
          </div>

          <div class="actions">
            <button id="saveConfig">Save Config</button>
            <button id="downloadConfig" class="secondary">Download Config JSON</button>
            <button id="loadConfig" class="secondary">Load Config JSON</button>
            <button id="refreshStatus" class="secondary">Refresh</button>
          </div>
          <input id="configFile" class="hidden-file" type="file" accept="application/json,.json">
        </section>

        <section>
          <h2>Microphone</h2>
          <div class="actions">
            <button id="startMic">Start Filter</button>
            <button id="stopMic" class="danger">Stop Filter</button>
          </div>
        </section>

        <section>
          <h2>Server Status</h2>
          <pre id="statusJson">{{ status_json }}</pre>
        </section>
      </div>

      <div>
        <section>
          <h2>Live Results</h2>
          <div class="metrics">
            <div class="metric"><span>Frames Sent</span><strong id="framesSent">0</strong></div>
            <div class="metric"><span>Segments</span><strong id="segmentsSeen">0</strong></div>
            <div class="metric"><span>Audio Bytes</span><strong id="audioBytes">0</strong></div>
            <div class="metric"><span>Input Seconds</span><strong id="inputSeconds">0.00</strong></div>
            <div class="metric"><span>Output Seconds</span><strong id="outputSeconds">0.00</strong></div>
            <div class="metric"><span>Speed</span><strong id="realtimeSpeed">0.00x</strong></div>
          </div>
          <div id="log" class="log"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const ASR_BACKEND = "openai-whisper";
    const TTS_BACKEND = "coqui-xtts";

    const state = {
      socket: null,
      micStream: null,
      audioContext: null,
      processor: null,
      source: null,
      pendingSamples: [],
      playbackTime: 0,
      framesSent: 0,
      segmentsSeen: 0,
      audioBytes: 0,
      inputSeconds: 0,
      outputSeconds: 0,
      realtimeSpeed: 0,
      targetRate: 16000,
      frameSamples: 320,
      processorReady: false,
      recordingOnly: false,
      recordingPromise: null,
      recordingResolver: null,
      configPromise: null,
      configResolver: null,
      bankRecorder: null
    };

    const elements = {
      connectionStatus: document.getElementById("connectionStatus"),
      bankUser: document.getElementById("bankUser"),
      bankWord: document.getElementById("bankWord"),
      gibberishBucket: document.getElementById("gibberishBucket"),
      gibberishName: document.getElementById("gibberishName"),
      bankWords: document.getElementById("bankWords"),
      gibberishClips: document.getElementById("gibberishClips"),
      bankStatusJson: document.getElementById("bankStatusJson"),
      whitelist: document.getElementById("whitelist"),
      seed: document.getElementById("seed"),
      audioBankUser: document.getElementById("audioBankUser"),
      audioReplacementMode: document.getElementById("audioReplacementMode"),
      audioBankMissingWordPolicy: document.getElementById("audioBankMissingWordPolicy"),
      asrModel: document.getElementById("asrModel"),
      confidence: document.getElementById("confidence"),
      bufferSeconds: document.getElementById("bufferSeconds"),
      configFile: document.getElementById("configFile"),
      statusJson: document.getElementById("statusJson"),
      log: document.getElementById("log"),
      framesSent: document.getElementById("framesSent"),
      segmentsSeen: document.getElementById("segmentsSeen"),
      audioBytes: document.getElementById("audioBytes"),
      inputSeconds: document.getElementById("inputSeconds"),
      outputSeconds: document.getElementById("outputSeconds"),
      realtimeSpeed: document.getElementById("realtimeSpeed")
    };
    const startMicButton = document.getElementById("startMic");
    const stopMicButton = document.getElementById("stopMic");

    const initialStatus = {{ status_json|safe }};
    renderStatus(initialStatus);

    document.getElementById("saveConfig").addEventListener("click", saveConfig);
    document.getElementById("downloadConfig").addEventListener("click", downloadConfigJson);
    document.getElementById("loadConfig").addEventListener("click", () => elements.configFile.click());
    elements.configFile.addEventListener("change", loadConfigJson);
    document.getElementById("refreshStatus").addEventListener("click", refreshStatus);
    document.getElementById("startMic").addEventListener("click", startMic);
    document.getElementById("stopMic").addEventListener("click", stopSession);
    document.getElementById("recordWord").addEventListener("click", startWordRecording);
    document.getElementById("stopWord").addEventListener("click", stopBankRecording);
    document.getElementById("recordGibberish").addEventListener("click", startGibberishRecording);
    document.getElementById("stopGibberish").addEventListener("click", stopBankRecording);
    document.getElementById("validateBank").addEventListener("click", validateBank);
    document.getElementById("useBankConfig").addEventListener("click", useBankConfig);
    elements.bankUser.addEventListener("input", () => {
      elements.audioBankUser.value = elements.bankUser.value.trim();
    });
    updateModelHint();
    updateStartButton();
    validateBank();

    async function saveConfig() {
      const payload = readConfig();
      const response = await fetch("/api/config/whitelist/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      renderStatus(data.config || data);
      appendLog("Config saved");
      return data.config || data;
    }

    function downloadConfigJson() {
      const config = readConfig();
      const filePayload = {
        live_gibberish_config_version: 1,
        saved_at: new Date().toISOString(),
        config
      };
      const blob = new Blob([JSON.stringify(filePayload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      const user = (config.audio_bank_user || "default").replace(/[^a-zA-Z0-9_.-]+/g, "-");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = `live-gibberish-${user}-config.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
      appendLog("Config JSON downloaded");
    }

    async function loadConfigJson() {
      const file = elements.configFile.files && elements.configFile.files[0];
      elements.configFile.value = "";
      if (!file) {
        return;
      }
      try {
        const parsed = JSON.parse(await file.text());
        const config = normalizeLoadedConfig(parsed);
        applyConfigToForm(config);
        const saved = await saveConfig();
        await validateBank();
        renderStatus(saved);
        appendLog(`Config JSON loaded: ${escapeHtml(file.name)}`);
      } catch (error) {
        appendLog(`Config JSON error: ${escapeHtml(error.message || error)}`);
      }
    }

    async function refreshStatus() {
      const response = await fetch("/api/status/");
      const data = await response.json();
      renderStatus(data.status || data);
      appendLog("Status refreshed");
    }

    async function startWordRecording() {
      const word = elements.bankWord.value.trim();
      if (!word) {
        appendLog("Whitelist word is empty");
        return;
      }
      await startBankRecording({ kind: "whitelist", word });
    }

    async function startGibberishRecording() {
      const bucket = elements.gibberishBucket.value;
      const name = elements.gibberishName.value.trim() || `${bucket}-${Date.now()}`;
      await startBankRecording({ kind: "gibberish", bucket, name });
    }

    async function startBankRecording(metadata) {
      if (state.bankRecorder) {
        appendLog("Bank recorder is already running");
        return;
      }
      const audioContext = new AudioContext();
      await audioContext.resume();
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      const source = audioContext.createMediaStreamSource(stream);
      const processor = audioContext.createScriptProcessor(2048, 1, 1);
      const samples = [];
      processor.onaudioprocess = event => {
        const input = event.inputBuffer.getChannelData(0);
        const resampled = resample(input, audioContext.sampleRate, state.targetRate);
        for (const sample of resampled) {
          samples.push(sample);
        }
      };
      source.connect(processor);
      processor.connect(audioContext.destination);
      state.bankRecorder = { audioContext, stream, source, processor, samples, metadata };
      elements.connectionStatus.textContent = "Bank Recording";
      appendLog(metadata.kind === "whitelist" ? `Recording word: ${escapeHtml(metadata.word)}` : `Recording gibberish: ${escapeHtml(metadata.bucket)}`);
    }

    async function stopBankRecording() {
      const recorder = state.bankRecorder;
      if (!recorder) {
        appendLog("No bank recording is active");
        return;
      }
      recorder.processor.disconnect();
      recorder.source.disconnect();
      recorder.stream.getTracks().forEach(track => track.stop());
      await recorder.audioContext.close();
      state.bankRecorder = null;
      elements.connectionStatus.textContent = "Uploading";
      try {
        const wav = encodeWav(recorder.samples, state.targetRate);
        const manifest = await uploadBankRecording(recorder.metadata, wav);
        renderBankManifest(manifest);
        syncWhitelistFromBank(manifest);
        await validateBank();
        elements.connectionStatus.textContent = "Idle";
        appendLog("Bank recording saved");
      } catch (error) {
        elements.connectionStatus.textContent = "Error";
        appendLog(`Bank recording error: ${escapeHtml(error.message || error)}`);
      }
    }

    async function uploadBankRecording(metadata, wav) {
      const form = new FormData();
      form.append("user_id", bankUser());
      form.append("kind", metadata.kind);
      if (metadata.kind === "whitelist") {
        form.append("word", metadata.word);
      } else {
        form.append("bucket", metadata.bucket);
        form.append("name", metadata.name);
      }
      form.append("file", wav, `${metadata.kind}-${Date.now()}.wav`);
      const response = await fetch("/api/audio-bank/recording/", {
        method: "POST",
        body: form
      });
      if (!response.ok) {
        throw new Error(await response.text());
      }
      const data = await response.json();
      return data.manifest;
    }

    async function validateBank() {
      const words = readWhitelistWords();
      const params = new URLSearchParams();
      params.set("user_id", bankUser());
      if (words.length) {
        params.set("whitelist", words.join(","));
      }
      const response = await fetch(`/api/audio-bank/status/?${params.toString()}`);
      const data = await response.json();
      elements.bankStatusJson.textContent = JSON.stringify(data.validation || data, null, 2);
      renderBankManifest(data.manifest || {});
      appendLog(data.ok ? "Audio bank valid" : "Audio bank needs recordings");
      return data;
    }

    async function useBankConfig() {
      elements.audioBankUser.value = bankUser();
      elements.audioReplacementMode.value = "prerecorded_sample_substitution";
      if (!elements.audioBankMissingWordPolicy.value) {
        elements.audioBankMissingWordPolicy.value = "strict";
      }
      const data = await validateBank();
      await saveConfig();
      appendLog(data.ok ? "Bank config saved" : "Bank config saved with validation issues");
    }

    function bankUser() {
      const user = elements.bankUser.value.trim() || elements.audioBankUser.value.trim() || "default";
      elements.bankUser.value = user;
      elements.audioBankUser.value = user;
      return user;
    }

    function readWhitelistWords() {
      return elements.whitelist.value.split(/[\s,;]+/).map(word => word.trim()).filter(Boolean);
    }

    function syncWhitelistFromBank(manifest) {
      const current = readWhitelistWords();
      const seen = new Set(current.map(word => word.toLowerCase()));
      for (const word of Object.keys(manifest.whitelist || {})) {
        if (!seen.has(word.toLowerCase())) {
          current.push(word);
          seen.add(word.toLowerCase());
        }
      }
      elements.whitelist.value = current.join(", ");
    }

    function renderBankManifest(manifest) {
      const whitelist = manifest.whitelist || {};
      const gibberish = manifest.gibberish || {};
      elements.bankWords.innerHTML = "";
      for (const word of Object.keys(whitelist).sort()) {
        elements.bankWords.appendChild(pill(word, "ok"));
      }
      if (!Object.keys(whitelist).length) {
        elements.bankWords.appendChild(pill("no words", "bad"));
      }
      elements.gibberishClips.innerHTML = "";
      for (const bucket of ["short", "medium", "long"]) {
        const count = (gibberish[bucket] || []).length;
        elements.gibberishClips.appendChild(pill(`${bucket}: ${count}`, count ? "ok" : "bad"));
      }
    }

    function pill(text, stateName) {
      const item = document.createElement("span");
      item.className = `pill ${stateName || ""}`;
      item.textContent = text;
      return item;
    }

    function readConfig() {
      return {
        whitelist: readWhitelistWords(),
        seed: elements.seed.value.trim() || "cavegame-live-gibberish",
        audio_bank_user: elements.audioBankUser.value.trim(),
        audio_replacement_mode: elements.audioReplacementMode.value,
        audio_bank_missing_word_policy: elements.audioBankMissingWordPolicy.value,
        asr_backend: ASR_BACKEND,
        asr_model: elements.asrModel.value,
        tts_backend: TTS_BACKEND,
        confidence: Number(elements.confidence.value || 0.7),
        buffer_seconds: Number(elements.bufferSeconds.value || 5)
      };
    }

    function normalizeLoadedConfig(parsed) {
      const config = parsed && parsed.config ? parsed.config : parsed;
      if (!config || typeof config !== "object" || Array.isArray(config)) {
        throw new Error("Config JSON must contain an object.");
      }
      return config;
    }

    function applyConfigToForm(config) {
      if (config.whitelist !== undefined) {
        elements.whitelist.value = Array.isArray(config.whitelist) ? config.whitelist.join(", ") : String(config.whitelist || "");
      }
      if (config.seed !== undefined) {
        elements.seed.value = String(config.seed || "");
      }
      if (config.audio_bank_user !== undefined) {
        elements.audioBankUser.value = String(config.audio_bank_user || "");
        elements.bankUser.value = String(config.audio_bank_user || "") || elements.bankUser.value || "default";
      }
      if (config.audio_replacement_mode !== undefined) {
        elements.audioReplacementMode.value = String(config.audio_replacement_mode || "original_gibberish");
      }
      if (config.audio_bank_missing_word_policy !== undefined) {
        elements.audioBankMissingWordPolicy.value = String(config.audio_bank_missing_word_policy || "strict");
      }
      if (config.asr_model !== undefined) {
        elements.asrModel.value = String(config.asr_model || "");
      }
      if (config.confidence !== undefined) {
        elements.confidence.value = Number(config.confidence);
      }
      if (config.buffer_seconds !== undefined) {
        elements.bufferSeconds.value = Number(config.buffer_seconds);
      }
    }

    function connectSocket() {
      if (state.socket && state.socket.readyState === WebSocket.OPEN) {
        appendLog("WebSocket is already connected");
        return;
      }

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/ws/audio/`);
      socket.binaryType = "arraybuffer";
      socket.onopen = () => {
        state.socket = socket;
        state.processorReady = false;
        updateStartButton();
        elements.connectionStatus.textContent = "Connected";
        if (!state.recordingOnly) {
          applySocketConfig(readConfig());
        }
        appendLog("WebSocket connected");
      };
      socket.onclose = () => {
        state.processorReady = false;
        updateStartButton();
        elements.connectionStatus.textContent = "Closed";
        appendLog("WebSocket closed");
      };
      socket.onerror = () => {
        elements.connectionStatus.textContent = "Error";
        appendLog("WebSocket error");
      };
      socket.onmessage = event => {
        if (typeof event.data === "string") {
          handleJsonMessage(event.data);
        } else {
          handleAudioMessage(event.data);
        }
      };
    }

    async function startMic() {
      state.recordingOnly = true;
      resetRunMetrics();
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        connectSocket();
        await waitForSocketOpen();
      }
      state.recordingPromise = new Promise(resolve => {
        state.recordingResolver = resolve;
      });
      state.socket.send(JSON.stringify({ type: "start_session", config: readConfig() }));
      await state.recordingPromise;
      await startCapture({ requireProcessor: false });
    }

    async function stopSession() {
      stopCaptureOnly();
      if (state.socket && state.socket.readyState === WebSocket.OPEN) {
        state.socket.send(JSON.stringify({ type: "stop_session" }));
      }
      elements.connectionStatus.textContent = "Processing";
    }

    async function startCapture({ requireProcessor }) {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        connectSocket();
        await waitForSocketOpen();
      }
      if (requireProcessor && !state.processorReady) {
        appendLog("Waiting for processor to finish loading");
        await waitForProcessorReady();
      }
      if (requireProcessor && !state.processorReady) {
        appendLog("Processor is not ready; microphone was not started");
        return;
      }

      state.audioContext = state.audioContext || new AudioContext();
      await state.audioContext.resume();
      state.micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      state.source = state.audioContext.createMediaStreamSource(state.micStream);
      state.processor = state.audioContext.createScriptProcessor(2048, 1, 1);
      state.processor.onaudioprocess = event => {
        const input = event.inputBuffer.getChannelData(0);
        const resampled = resample(input, state.audioContext.sampleRate, state.targetRate);
        for (const sample of resampled) {
          state.pendingSamples.push(sample);
        }
        while (state.pendingSamples.length >= state.frameSamples) {
          const frame = state.pendingSamples.splice(0, state.frameSamples);
          sendPcm16(frame);
        }
      };
      state.source.connect(state.processor);
      state.processor.connect(state.audioContext.destination);
      elements.connectionStatus.textContent = requireProcessor ? "Streaming" : "Recording";
      appendLog(requireProcessor ? "Microphone started" : "Recording started");
    }

    function stopAll() {
      stopCaptureOnly();
      if (state.socket) {
        state.socket.close();
        state.socket = null;
      }
      state.recordingOnly = false;
      state.processorReady = false;
      updateStartButton();
      elements.connectionStatus.textContent = "Stopped";
      appendLog("Stopped");
    }

    function stopCaptureOnly() {
      if (state.processor) {
        state.processor.disconnect();
        state.processor = null;
      }
      if (state.source) {
        state.source.disconnect();
        state.source = null;
      }
      if (state.micStream) {
        state.micStream.getTracks().forEach(track => track.stop());
        state.micStream = null;
      }
      state.pendingSamples = [];
    }

    function sendPcm16(samples) {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        return;
      }
      const bytes = new ArrayBuffer(samples.length * 2);
      const view = new DataView(bytes);
      for (let index = 0; index < samples.length; index++) {
        const sample = Math.max(-1, Math.min(1, samples[index]));
        view.setInt16(index * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
      }
      state.socket.send(bytes);
      state.framesSent += 1;
      elements.framesSent.textContent = String(state.framesSent);
    }

    function handleJsonMessage(text) {
      const data = JSON.parse(text);
      if (data.type === "segment") {
        state.segmentsSeen += 1;
        elements.segmentsSeen.textContent = String(state.segmentsSeen);
        state.outputSeconds += Number(data.output_duration_seconds || 0);
        elements.outputSeconds.textContent = state.outputSeconds.toFixed(2);
        const words = (data.words || []).map(word => {
          const cls = word.allowed ? "allowed" : "blocked";
          const replacement = word.replacement ? ` -> ${word.replacement}` : "";
          const original = word.original && word.original !== word.word ? `${word.original} / ` : "";
          const reason = word.reason ? ` (${word.reason})` : "";
          return `<span class="${cls}">${escapeHtml(original)}${escapeHtml(word.word || "?")}</span>${escapeHtml(replacement)}${escapeHtml(reason)}`;
        }).join(", ");
        appendLog(`Segment ${data.start.toFixed(2)}-${data.end.toFixed(2)}s: ${escapeHtml(data.text || "")}\nInput: ${formatSeconds(data.input_duration_seconds)} Output: ${formatSeconds(data.output_duration_seconds)} Ratio: ${formatRatio(data.output_to_input_ratio)}\n${words}`);
      } else if (data.type === "ready") {
        state.processorReady = Boolean(data.processor_ready);
        updateStartButton();
        if (data.error) {
          appendLog(`Ready error: ${escapeHtml(data.error)}`);
        } else {
          appendLog(`Socket ready: ${escapeHtml(data.status || "ready")}`);
        }
      } else if (data.type === "processor") {
        state.processorReady = Boolean(data.ok);
        updateStartButton();
        appendLog(`Processor ${escapeHtml(data.status || "status")} ${escapeHtml(data.backend || "")} ${escapeHtml(data.model || "")}`);
      } else if (data.type === "config") {
        state.processorReady = Boolean(data.processor_ready || data.ok);
        updateStartButton();
        if (state.configResolver) {
          state.configResolver(state.processorReady);
          state.configResolver = null;
          state.configPromise = null;
        }
        appendLog(data.ok ? "Processor ready" : `Processor error: ${escapeHtml(data.error || "unknown")}`);
      } else if (data.type === "error") {
        appendLog(`Error: ${escapeHtml(data.message || JSON.stringify(data))}`);
      } else if (data.type === "session") {
        if (data.status === "recording") {
          if (state.recordingResolver) {
            state.recordingResolver(true);
            state.recordingResolver = null;
            state.recordingPromise = null;
          }
          elements.connectionStatus.textContent = "Recording";
          appendLog(`Recording input: ${escapeHtml(data.input_wav || "")}`);
        } else if (data.status === "processing") {
          elements.connectionStatus.textContent = "Processing";
          appendLog("Processing recorded WAV");
        } else if (data.ok) {
          state.recordingOnly = false;
          elements.connectionStatus.textContent = "Done";
          renderBenchmark(data.benchmark || {});
          appendLog(`Output WAV: ${escapeHtml(data.output_wav || "")}\nInput WAV: ${escapeHtml(data.input_wav || "")}\nSegments: ${data.segments || 0}\nInput: ${formatSeconds(data.benchmark && data.benchmark.input_seconds)} Output: ${formatSeconds(data.benchmark && data.benchmark.output_seconds)} Processing: ${formatSeconds(data.benchmark && data.benchmark.processing_seconds)} Speed: ${formatSpeed(data.benchmark && data.benchmark.realtime_speed)}`);
        } else {
          state.recordingOnly = false;
          elements.connectionStatus.textContent = "Error";
          appendLog(`Session error: ${escapeHtml(data.error || "unknown")}`);
        }
      } else {
        appendLog(JSON.stringify(data));
      }
    }

    function handleAudioMessage(buffer) {
      state.audioBytes += buffer.byteLength;
      elements.audioBytes.textContent = String(state.audioBytes);
      state.outputSeconds = state.audioBytes / (state.targetRate * 2);
      elements.outputSeconds.textContent = state.outputSeconds.toFixed(2);
      const samples = pcm16ToFloat32(buffer);
      playSamples(samples);
    }

    function playSamples(samples) {
      state.audioContext = state.audioContext || new AudioContext();
      const audioBuffer = state.audioContext.createBuffer(1, samples.length, state.targetRate);
      audioBuffer.copyToChannel(samples, 0);
      const source = state.audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(state.audioContext.destination);
      const now = state.audioContext.currentTime;
      state.playbackTime = Math.max(now + 0.03, state.playbackTime);
      source.start(state.playbackTime);
      state.playbackTime += audioBuffer.duration;
    }

    function resample(input, sourceRate, targetRate) {
      if (sourceRate === targetRate) {
        return Array.from(input);
      }
      const ratio = sourceRate / targetRate;
      const outputLength = Math.floor(input.length / ratio);
      const output = new Array(outputLength);
      for (let index = 0; index < outputLength; index++) {
        const position = index * ratio;
        const left = Math.floor(position);
        const right = Math.min(left + 1, input.length - 1);
        const fraction = position - left;
        output[index] = input[left] + (input[right] - input[left]) * fraction;
      }
      return output;
    }

    function pcm16ToFloat32(buffer) {
      const view = new DataView(buffer);
      const samples = new Float32Array(buffer.byteLength / 2);
      for (let index = 0; index < samples.length; index++) {
        samples[index] = view.getInt16(index * 2, true) / 32768;
      }
      return samples;
    }

    function encodeWav(samples, sampleRate) {
      const pcm = floatSamplesToPcm16(samples);
      const buffer = new ArrayBuffer(44 + pcm.length * 2);
      const view = new DataView(buffer);
      writeAscii(view, 0, "RIFF");
      view.setUint32(4, 36 + pcm.length * 2, true);
      writeAscii(view, 8, "WAVE");
      writeAscii(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeAscii(view, 36, "data");
      view.setUint32(40, pcm.length * 2, true);
      for (let index = 0; index < pcm.length; index++) {
        view.setInt16(44 + index * 2, pcm[index], true);
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function floatSamplesToPcm16(samples) {
      const pcm = new Int16Array(samples.length);
      for (let index = 0; index < samples.length; index++) {
        const sample = Math.max(-1, Math.min(1, samples[index]));
        pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
      }
      return pcm;
    }

    function writeAscii(view, offset, text) {
      for (let index = 0; index < text.length; index++) {
        view.setUint8(offset + index, text.charCodeAt(index));
      }
    }

    function renderStatus(status) {
      elements.statusJson.textContent = JSON.stringify(status, null, 2);
      if (status.asr_model !== undefined) {
        elements.asrModel.value = status.asr_model || "";
      }
      if (status.audio_bank_user !== undefined) {
        elements.audioBankUser.value = status.audio_bank_user || "";
        elements.bankUser.value = status.audio_bank_user || elements.bankUser.value || "default";
      }
      if (status.audio_replacement_mode !== undefined) {
        elements.audioReplacementMode.value = status.audio_replacement_mode || "original_gibberish";
      }
      if (status.audio_bank_missing_word_policy !== undefined) {
        elements.audioBankMissingWordPolicy.value = status.audio_bank_missing_word_policy || "strict";
      }
      if (status.model_hint) {
        document.getElementById("modelHint").textContent = status.model_hint;
      } else {
        updateModelHint();
      }
    }

    function updateModelHint() {
      const hint = document.getElementById("modelHint");
      hint.textContent = "Fixed backend: GPU openai-whisper ASR plus GPU Coqui XTTS. Record 5s+ so the backend can create the speaker reference and output WAV.";
    }

    function appendLog(message) {
      const entry = document.createElement("div");
      entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
      elements.log.prepend(entry);
    }

    function renderBenchmark(benchmark) {
      state.inputSeconds = Number(benchmark.input_seconds || 0);
      state.outputSeconds = Number(benchmark.output_seconds || 0);
      state.realtimeSpeed = Number(benchmark.realtime_speed || 0);
      elements.inputSeconds.textContent = state.inputSeconds.toFixed(2);
      elements.outputSeconds.textContent = state.outputSeconds.toFixed(2);
      elements.realtimeSpeed.textContent = formatSpeed(state.realtimeSpeed);
    }

    function formatSeconds(value) {
      const number = Number(value || 0);
      return `${number.toFixed(3)}s`;
    }

    function formatRatio(value) {
      const number = Number(value || 0);
      return `${number.toFixed(3)}x`;
    }

    function formatSpeed(value) {
      const number = Number(value || 0);
      return `${number.toFixed(2)}x`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[character]));
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function applySocketConfig(payload) {
      if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
        return Promise.resolve(false);
      }
      state.processorReady = false;
      updateStartButton();
      state.configPromise = new Promise(resolve => {
        state.configResolver = resolve;
        window.setTimeout(() => {
          if (state.configResolver === resolve) {
            state.configResolver = null;
            state.configPromise = null;
            appendLog("Processor initialization is still running");
            resolve(false);
          }
        }, 45000);
      });
      state.socket.send(JSON.stringify({ type: "config", config: payload }));
      return state.configPromise;
    }

    function waitForSocketOpen() {
      if (state.socket && state.socket.readyState === WebSocket.OPEN) {
        return Promise.resolve(true);
      }
      return new Promise(resolve => {
        const started = Date.now();
        const timer = window.setInterval(() => {
          if (state.socket && state.socket.readyState === WebSocket.OPEN) {
            window.clearInterval(timer);
            resolve(true);
          } else if (Date.now() - started > 5000) {
            window.clearInterval(timer);
            resolve(false);
          }
        }, 50);
      });
    }

    function waitForProcessorReady() {
      if (state.processorReady) {
        return Promise.resolve(true);
      }
      return state.configPromise || Promise.resolve(false);
    }

    function updateStartButton() {
      startMicButton.disabled = false;
      stopMicButton.disabled = false;
      startMicButton.textContent = "Start Filter";
    }

    function resetRunMetrics() {
      state.pendingSamples = [];
      state.playbackTime = 0;
      state.framesSent = 0;
      state.segmentsSeen = 0;
      state.audioBytes = 0;
      state.inputSeconds = 0;
      state.outputSeconds = 0;
      state.realtimeSpeed = 0;
      elements.framesSent.textContent = "0";
      elements.segmentsSeen.textContent = "0";
      elements.audioBytes.textContent = "0";
      elements.inputSeconds.textContent = "0.00";
      elements.outputSeconds.textContent = "0.00";
      elements.realtimeSpeed.textContent = "0.00x";
    }
  </script>
</body>
</html>
